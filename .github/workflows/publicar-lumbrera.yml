# Publica Lumbrera (genesis.andresrendon.com) en Cloudflare cada vez que se sube algo a main.
# Necesita el secreto CLOUDFLARE_API_TOKEN en GitHub: Settings → Secrets and variables → Actions.
# También se puede lanzar a mano desde la pestaña «Actions» → «Publicar Lumbrera» → «Run workflow».
name: Publicar Lumbrera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-lumbrera
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar el token de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN. Añádelo en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Publicar en Cloudflare (worker «lumbrera»)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env fe
