<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1640">
<title>Lumbrera · Aprende la Biblia libro a libro</title>
<meta name="description" content="Aprende la Biblia libro a libro con lecciones cortas: preguntas, versículos para completar, hechos para ordenar y personajes para emparejar. Gratis y sin registrarte.">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh}
  .app{max-width:560px;margin:0 auto;padding:0 16px 100px;position:relative;z-index:2}
  .top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:14px 0;position:sticky;top:0;z-index:10;background:linear-gradient(var(--noche) 70%,transparent)}
  .stats{display:flex;gap:.5rem}
  .stat{display:flex;align-items:center;gap:.3rem;background:var(--noche2);border:1px solid #433a86;border-radius:99px;padding:.3em .75em;font-weight:800;font-size:.95rem}
  .stat.racha b{color:#FF9A4D}.stat.xp b{color:var(--ambar)}
  h1.t{font-size:1.8rem;margin:.4rem 0 .2rem}
  .sub{color:var(--suave);margin:0 0 1rem}
  .meta{display:flex;align-items:center;gap:1rem;background:var(--noche2);border:1px solid #433a86;border-radius:20px;padding:1rem 1.1rem;margin:.6rem 0 1.4rem}
  .anillo{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ambar) calc(var(--p)*1%),#332B6E 0);display:grid;place-items:center;flex:none}
  .anillo span{width:44px;height:44px;border-radius:50%;background:var(--noche2);display:grid;place-items:center;font-weight:800;font-size:.85rem}
  .grupo-t{font-family:var(--tit);font-size:1.2rem;margin:1.4rem 0 .6rem;color:var(--suave)}
  .libros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .libros.solo{grid-template-columns:1fr;margin-top:1.4rem}
  .libros.solo .libro{padding:1.1rem;font-size:1.15rem}
  .libro{border:0;border-radius:16px;padding:.8rem .5rem;background:#241E52;color:#7E76AE;font-weight:800;font-size:.88rem;text-align:center;cursor:default;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem}
  .libro small{font-weight:600;font-size:.7rem;opacity:.9}
  .libro.on{background:var(--ambar);color:var(--noche);cursor:pointer;box-shadow:0 4px 0 #a9802f}
  .libro.on small{opacity:.8}
  .libro .barra{width:80%;height:5px;border-radius:9px;background:rgba(27,22,64,.25);overflow:hidden}
  .libro .barra i{display:block;height:100%;background:var(--noche)}
  /* Camino */
  .unidad{margin:1.6rem 0 .4rem;background:var(--c);color:#fff;border-radius:18px;padding:.9rem 1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .unidad h2{font-size:1.25rem}.unidad p{margin:.15rem 0 0;font-weight:700;opacity:.9;font-size:.92rem}
  .camino{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0}
  .nodo{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;font-size:1.6rem;font-weight:800;cursor:pointer;background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative;transition:transform .08s}
  .nodo:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .nodo.bloq{background:#332B6E;color:#7E76AE;cursor:not-allowed;box-shadow:0 6px 0 #1a1540}
  .nodo.hecho{background:var(--ambar);color:var(--noche)}
  .nodo .est{position:absolute;bottom:-18px;font-size:.78rem;letter-spacing:1px;color:var(--ambar);white-space:nowrap}
  .nodo.actual::after{content:'Empieza aquí';position:absolute;top:-30px;background:#fff;color:var(--noche);font-size:.75rem;font-weight:800;padding:.25em .6em;border-radius:8px;white-space:nowrap}
  .u0{--c:#E2557A}.u1{--c:#2EA7C4}.u2{--c:#7B5CE6}.u3{--c:#2EAF7D}.u4{--c:#D9772B}
  /* Lección */
  .lec-top{display:flex;align-items:center;gap:.8rem;padding:14px 0}
  .cerrar{background:none;border:0;color:var(--suave);font-size:1.6rem;cursor:pointer;line-height:1;padding:.2rem .4rem}
  .prog{flex:1;height:16px;border-radius:99px;background:#332B6E;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--ambar);border-radius:99px;transition:width .35s ease}
  .tipo{color:var(--suave);font-weight:800;font-size:.95rem;margin:.6rem 0 .3rem}
  .enunciado{font-family:var(--tit);font-size:1.45rem;line-height:1.22;margin:0 0 1.2rem}
  .enunciado .hueco{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ambar);color:var(--ambar)}
  .ops{display:grid;gap:10px}
  .op{border:2px solid #433a86;background:var(--noche2);color:var(--texto);border-radius:16px;padding:1rem 1.1rem;font-size:1.05rem;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 3px 0 #120e2c}
  .op.sel{border-color:var(--ambar);background:#3a2f63}
  .op:disabled{cursor:default}
  .vf{grid-template-columns:1fr 1fr}.vf .op{text-align:center;font-size:1.2rem;padding:1.4rem}
  .zona{min-height:120px;border:2px dashed #433a86;border-radius:16px;padding:10px;display:grid;gap:8px;margin-bottom:12px;align-content:start}
  .zona .vacio{color:#7E76AE;font-weight:700;text-align:center;padding:1.6rem 0}
  .ficha{border:2px solid #433a86;background:var(--noche2);color:var(--texto);border-radius:14px;padding:.75rem .9rem;font-weight:700;text-align:left;cursor:pointer;display:flex;gap:.6rem;align-items:center}
  .ficha b{color:var(--ambar);min-width:1.2em}
  .pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pares .col{display:grid;gap:10px;align-content:start}
  .pares .ficha{min-height:62px;justify-content:center;text-align:center;font-size:.92rem}
  .pares .ficha.sel{border-color:var(--ambar);background:#3a2f63}
  .pares .ficha.ok{border-color:#2EAF7D;background:rgba(46,175,125,.15);color:#8fe3c0;cursor:default}
  .pares .ficha.mal{animation:temblor .3s;border-color:#E2557A}
  @keyframes temblor{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .pie-lec{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--noche);border-top:2px solid #332B6E}
  .pie-lec .dentro{max-width:560px;margin:0 auto;display:grid;gap:.6rem}
  .pie-lec.bien{background:#163d33;border-color:#2EAF7D}.pie-lec.mal{background:#47182a;border-color:#E2557A}
  .pie-lec h3{font-size:1.35rem}.pie-lec.bien h3{color:#8fe3c0}.pie-lec.mal h3{color:#ff9fb6}
  .pie-lec p{margin:0;line-height:1.4}.pie-lec .ref{font-weight:800;color:var(--ambar)}
  .grande{width:100%;font-size:1.1rem;padding:1em}
  .fin{text-align:center;padding-top:8vh;display:grid;gap:1rem;justify-items:center}
  .fin .big{font-size:4rem}
  .cajas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
  .caja-f{background:var(--noche2);border:2px solid #433a86;border-radius:16px;padding:.8rem .4rem}
  .caja-f b{display:block;font-family:var(--tit);font-size:1.6rem;color:var(--ambar)}
  .repaso{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--noche2);border:1px solid #433a86;border-radius:18px;padding:1rem 1.1rem;margin-top:1.2rem}
  .creditos{color:#7E76AE;font-size:.72rem;text-align:center;margin-top:2rem}
</style>
</head>
<body class="tema-fe">
<div class="app" id="app"></div>
<script src="comun.js"></script>
<script>
// ===================== Estado (se guarda en este dispositivo) =====================
const CLAVE_E = 'lumbrera-aprender';
const hoyISO = () => new Date().toLocaleDateString('sv-SE');
let E = { xp: 0, racha: 0, ultimoDia: '', meta: 30, hoy: { fecha: '', xp: 0 }, lecciones: {}, fallos: {} };
try { Object.assign(E, JSON.parse(localStorage.getItem(CLAVE_E) || '{}')); } catch {}
function guardarE() { try { localStorage.setItem(CLAVE_E, JSON.stringify(E)); } catch {} }
function xpHoy() { return E.hoy.fecha === hoyISO() ? E.hoy.xp : 0; }
function rachaViva() { if (!E.ultimoDia) return 0; const d = (new Date(hoyISO()) - new Date(E.ultimoDia)) / 864e5; return d <= 1 ? E.racha : 0; }
function sumarXP(n) {
  const hoy = hoyISO();
  if (E.hoy.fecha !== hoy) E.hoy = { fecha: hoy, xp: 0 };
  E.xp += n; E.hoy.xp += n;
  if (E.ultimoDia !== hoy) {
    const ayer = new Date(Date.now() - 864e5).toLocaleDateString('sv-SE');
    E.racha = E.ultimoDia === ayer ? E.racha + 1 : 1; E.ultimoDia = hoy;
  }
  guardarE();
}

// ===================== Datos =====================
let CAT = null; const LIBROS = {};
async function catalogo() { if (!CAT) CAT = await fetch(BASE + 'biblia/libros.json').then(r => r.json()); return CAT; }
async function libro(id) { if (!LIBROS[id]) LIBROS[id] = await fetch(BASE + 'biblia/' + id + '.json').then(r => r.json()); return LIBROS[id]; }
function claveLec(lid, u, l) { return `${lid}-${u}-${l}`; }
function progresoLibro(L) {
  let hechas = 0, total = 0;
  L.unidades.forEach((u, ui) => u.lecciones.forEach((_, li) => { total++; if (E.lecciones[claveLec(L.id, ui, li)]) hechas++; }));
  return { hechas, total };
}
function fallosDe(lid) { return Object.entries(E.fallos).filter(([id, f]) => f.libro === lid).map(([id]) => id); }

const APP = document.getElementById('app');
const barajar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function cabecera(extra = '') {
  return `<div class="top">${extra || marca()}<div class="stats">
    <span class="stat racha" title="Días seguidos aprendiendo">🔥 <b>${rachaViva()}</b></span>
    <span class="stat xp" title="Puntos de experiencia">⭐ <b>${E.xp}</b></span></div></div>`;
}

// ===================== Inicio: elegir libro =====================
async function inicio() {
  delete APP.dataset.vista;
  history.replaceState(null, '', location.pathname.endsWith('aprender') ? 'aprender' : './');
  const cat = await catalogo();
  const pct = Math.min(100, Math.round(100 * xpHoy() / E.meta));
  const tarjeta = b => {
    if (!b.preguntas) return `<div class="libro" aria-disabled="true">${esc(b.nombre)}<small>Pronto</small></div>`;
    const L = LIBROS[b.id]; const p = L ? progresoLibro(L) : null;
    return `<button class="libro on" data-l="${b.id}">${esc(b.nombre)}<small>${b.preguntas} preguntas</small>${p ? `<span class="barra"><i style="width:${100 * p.hechas / p.total}%"></i></span>` : ''}</button>`;
  };
  const totalFallos = Object.keys(E.fallos).length;
  APP.innerHTML = cabecera() + `
    <h1 class="t">Aprende Génesis</h1>
    <p class="sub">El libro de los comienzos, en lecciones de 10 preguntas. Unos minutos al día bastan.</p>
    <div class="meta"><div class="anillo" style="--p:${pct}"><span>${pct}%</span></div>
      <div><b>Meta de hoy: ${E.meta} puntos</b><div class="pie" style="opacity:1">${xpHoy() >= E.meta ? '¡Cumplida! Vuelve mañana para mantener la racha.' : `Llevas ${xpHoy()}. Una lección son unos 100.`}</div></div></div>
    ${totalFallos ? `<div class="repaso"><div><b>Repasa tus fallos</b><div class="pie" style="opacity:1">${totalFallos} pregunta${totalFallos === 1 ? '' : 's'} para afianzar</div></div><button class="btn peq" id="b-rep">Repasar</button></div>` : ''}
    <div class="libros solo">${cat.libros.map(tarjeta).join('')}</div>
    <p class="pie" style="text-align:center;margin-top:1.6rem"><a href="jugar">¿Vas a jugar en grupo? Entra con el PIN</a></p>
    <p class="creditos">${esc(cat.creditos)}</p>`;
  APP.querySelectorAll('[data-l]').forEach(b => b.onclick = () => verLibro(b.dataset.l));
  const br = document.getElementById('b-rep'); if (br) br.onclick = () => repasar(null);
  // carga en segundo plano los libros disponibles para mostrar su progreso
  for (const b of cat.libros.filter(x => x.preguntas && !LIBROS[x.id])) { await libro(b.id); }
  if (!APP.dataset.vista) inicioRefresco();
}
function inicioRefresco() { APP.querySelectorAll('[data-l]').forEach(b => { const L = LIBROS[b.dataset.l]; if (!L || b.querySelector('.barra')) return; const p = progresoLibro(L); b.insertAdjacentHTML('beforeend', `<span class="barra"><i style="width:${100 * p.hechas / p.total}%"></i></span>`); }); }

// ===================== Camino de un libro =====================
async function verLibro(id) {
  APP.dataset.vista = 'libro';
  const L = await libro(id);
  history.replaceState(null, '', 'aprender?libro=' + id);
  const p = progresoLibro(L);
  let siguiente = null, n = 0;
  const html = L.unidades.map((u, ui) => `
    <div class="unidad u${ui % 5}"><h2>Unidad ${ui + 1}: ${esc(u.titulo)}</h2><p>${esc(u.capitulos)}</p></div>
    <div class="camino u${ui % 5}">${u.lecciones.map((_, li) => {
      const k = claveLec(id, ui, li), hecho = E.lecciones[k];
      const desbloq = n === 0 || E.lecciones[claveLecAnterior(L, ui, li)];
      const esSig = !hecho && desbloq && !siguiente; if (esSig) siguiente = k;
      const off = [0, 60, -60][li % 3];
      n++;
      return `<button class="nodo ${hecho ? 'hecho' : desbloq ? '' : 'bloq'} ${esSig ? 'actual' : ''}" style="transform:translateX(${off}px)" data-u="${ui}" data-li="${li}" ${desbloq ? '' : 'disabled'} aria-label="Lección ${ui * 3 + li + 1}${hecho ? ', completada' : desbloq ? '' : ', bloqueada'}">
        ${hecho ? '✓' : desbloq ? '★' : '🔒'}${hecho ? `<span class="est">${'★'.repeat(hecho.estrellas)}${'☆'.repeat(3 - hecho.estrellas)}</span>` : ''}</button>`;
    }).join('')}</div>`).join('');
  const nf = fallosDe(id).length;
  APP.innerHTML = cabecera(`<button class="cerrar" id="b-atras" aria-label="Volver al inicio">←</button>`) + `
    <h1 class="t">${esc(L.nombre)}</h1><p class="sub">${p.hechas} de ${p.total} lecciones · ${L.total} preguntas · ${L.capitulos} capítulos</p>
    ${nf ? `<div class="repaso"><div><b>Repasa tus fallos de ${esc(L.nombre)}</b><div class="pie" style="opacity:1">${nf} pregunta${nf === 1 ? '' : 's'}</div></div><button class="btn peq" id="b-rep">Repasar</button></div>` : ''}
    ${html}
    ${p.hechas === p.total ? `<div class="repaso"><div><b>¡Has terminado ${esc(L.nombre)}! 🎉</b><div class="pie" style="opacity:1">Haz un repaso mezclado del libro entero</div></div><button class="btn peq" id="b-todo">Repaso</button></div>` : ''}`;
  document.getElementById('b-atras').onclick = () => { delete APP.dataset.vista; inicio(); };
  APP.querySelectorAll('.nodo:not(.bloq)').forEach(b => b.onclick = () => empezar(L, +b.dataset.u, +b.dataset.li));
  const br = document.getElementById('b-rep'); if (br) br.onclick = () => repasar(id);
  const bt = document.getElementById('b-todo'); if (bt) bt.onclick = () => repasoLibro(L);
  const act = APP.querySelector('.nodo.actual'); if (act) act.scrollIntoView({ block: 'center' });
}
function claveLecAnterior(L, ui, li) { if (li > 0) return claveLec(L.id, ui, li - 1); return claveLec(L.id, ui - 1, L.unidades[ui - 1].lecciones.length - 1); }

// ===================== Lección =====================
let LEC = null;
function empezar(L, ui, li) {
  const preguntas = L.unidades[ui].lecciones[li].preguntas.map(q => ({ ...q, libro: L.id }));
  LEC = { L, ui, li, cola: [...preguntas], total: preguntas.length, bien: 0, errores: 0, xp: 0, fallidas: new Set(), modo: 'leccion' };
  pintarPregunta();
}
function repasar(lid) {
  const ids = (lid ? fallosDe(lid) : Object.keys(E.fallos)).slice(0, 10);
  const todas = [];
  Promise.all([...new Set(ids.map(i => E.fallos[i].libro))].map(libro)).then(() => {
    for (const id of ids) { const q = buscar(id); if (q) todas.push(q); else delete E.fallos[id]; }
    if (!todas.length) { guardarE(); return inicio(); }
    LEC = { L: null, cola: barajar(todas), total: todas.length, bien: 0, errores: 0, xp: 0, fallidas: new Set(), modo: 'repaso', vuelta: lid };
    pintarPregunta();
  });
}
function repasoLibro(L) {
  const todas = []; L.unidades.forEach(u => u.lecciones.forEach(l => l.preguntas.forEach(q => todas.push({ ...q, libro: L.id }))));
  LEC = { L, cola: barajar(todas).slice(0, 15), total: 15, bien: 0, errores: 0, xp: 0, fallidas: new Set(), modo: 'repaso', vuelta: L.id };
  pintarPregunta();
}
function buscar(id) { const L = LIBROS[id.split('-')[0]]; if (!L) return null; for (const u of L.unidades) for (const l of u.lecciones) for (const q of l.preguntas) if (q.id === id) return { ...q, libro: L.id }; return null; }

const ETIQ = { opcion: 'Elige la respuesta correcta', completar: 'Completa el texto', vf: '¿Verdadero o falso?', ordenar: 'Ordena los hechos', emparejar: 'Empareja' };
let RESP = null;
function pintarPregunta() {
  APP.dataset.vista = 'leccion';
  const q = LEC.cola[0];
  RESP = null;
  const pct = 100 * LEC.bien / LEC.total;
  let cuerpo = '';
  if (q.t === 'opcion' || q.t === 'completar') {
    q._ops = q._ops || barajar([q.ok, ...q.malas]);
    cuerpo = `<div class="ops">${q._ops.map((o, i) => `<button class="op" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.t === 'vf') {
    cuerpo = `<div class="ops vf"><button class="op" data-v="1">Verdadero</button><button class="op" data-v="0">Falso</button></div>`;
  } else if (q.t === 'ordenar') {
    q._pool = barajar(q.orden.map((t, i) => ({ t, i })));
    cuerpo = `<div class="zona" id="zona"><div class="vacio">Toca los hechos en el orden en que ocurrieron</div></div><div class="ops" id="pool"></div>`;
  } else if (q.t === 'emparejar') {
    const izq = barajar(q.pares.map((p, i) => ({ t: p[0], i }))), der = barajar(q.pares.map((p, i) => ({ t: p[1], i })));
    cuerpo = `<div class="pares"><div class="col">${izq.map(x => `<button class="ficha" data-lado="a" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div class="col">${der.map(x => `<button class="ficha" data-lado="b" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  }
  const enunciado = q.t === 'completar' ? esc(q.q).replace('___', '<span class="hueco">&nbsp;</span>') : esc(q.q);
  APP.innerHTML = `<div class="lec-top"><button class="cerrar" id="b-salir" aria-label="Salir de la lección">✕</button><div class="prog"><i style="width:${pct}%"></i></div></div>
    <div class="tipo">${LEC.fallidas.has(q.id) ? '🔁 Otra vez · ' : ''}${ETIQ[q.t]}</div>
    <p class="enunciado">${enunciado}</p>${cuerpo}
    <div class="pie-lec" id="pie"><div class="dentro"><button class="btn grande" id="b-comprobar" disabled>Comprobar</button></div></div>`;
  document.getElementById('b-salir').onclick = salir;
  const comprobar = document.getElementById('b-comprobar');
  if (q.t === 'opcion' || q.t === 'completar' || q.t === 'vf') {
    APP.querySelectorAll('.op').forEach(b => b.onclick = () => {
      APP.querySelectorAll('.op').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      RESP = q.t === 'vf' ? b.dataset.v === '1' : q._ops[+b.dataset.i];
      if (q.t === 'completar') APP.querySelector('.hueco').textContent = RESP;
      comprobar.disabled = false;
    });
    comprobar.onclick = () => corregir(q.t === 'vf' ? RESP === q.v : RESP === q.ok, q.t === 'vf' ? (q.v ? 'Verdadero' : 'Falso') : q.ok);
  } else if (q.t === 'ordenar') {
    const elegidos = [];
    const pintar = () => {
      document.getElementById('zona').innerHTML = elegidos.length ? elegidos.map((x, k) => `<button class="ficha" data-k="${k}"><b>${k + 1}</b>${esc(x.t)}</button>`).join('') : '<div class="vacio">Toca los hechos en el orden en que ocurrieron</div>';
      document.getElementById('pool').innerHTML = q._pool.filter(x => !elegidos.includes(x)).map(x => `<button class="ficha" data-i="${x.i}">${esc(x.t)}</button>`).join('');
      document.querySelectorAll('#zona .ficha').forEach(b => b.onclick = () => { elegidos.splice(+b.dataset.k, 1); pintar(); });
      document.querySelectorAll('#pool .ficha').forEach(b => b.onclick = () => { elegidos.push(q._pool.find(x => x.i === +b.dataset.i)); pintar(); });
      comprobar.disabled = elegidos.length !== q.orden.length;
    };
    pintar();
    comprobar.onclick = () => corregir(elegidos.every((x, k) => x.i === k), q.orden.map((t, k) => `${k + 1}. ${t}`).join(' · '));
  } else if (q.t === 'emparejar') {
    let sel = null, hechos = 0, fallosPar = 0;
    comprobar.textContent = 'Empareja las cuatro parejas';
    APP.querySelectorAll('.pares .ficha').forEach(b => b.onclick = () => {
      if (b.classList.contains('ok')) return;
      if (!sel || sel.dataset.lado === b.dataset.lado) { APP.querySelectorAll('.pares .ficha.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; return; }
      if (sel.dataset.i === b.dataset.i) {
        [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; }); hechos++; sonido('tic');
        if (hechos === q.pares.length) corregir(fallosPar === 0, null, fallosPar);
      } else {
        fallosPar++; sonido('mal'); [sel, b].forEach(x => { x.classList.add('mal'); setTimeout(() => x.classList.remove('mal', 'sel'), 350); });
      }
      sel = null;
    });
  }
}
function corregir(ok, correcta, fallosPar = 0) {
  const q = LEC.cola.shift();
  const primera = !LEC.fallidas.has(q.id);
  const emparejadoConFallos = q.t === 'emparejar' && fallosPar > 0;
  if (ok || q.t === 'emparejar') {
    LEC.bien++; const g = ok && primera ? 10 : 5; LEC.xp += g;
    if (LEC.modo === 'repaso' && ok && primera) delete E.fallos[q.id]; // sale de la lista al acertarla en un repaso
    if (emparejadoConFallos) { LEC.errores++; E.fallos[q.id] = { libro: q.libro }; }
    sonido('ok'); if (navigator.vibrate) navigator.vibrate(20);
  } else {
    LEC.errores++; LEC.fallidas.add(q.id); LEC.cola.push(q); E.fallos[q.id] = { libro: q.libro };
    sonido('mal'); if (navigator.vibrate) navigator.vibrate(120);
  }
  guardarE();
  APP.querySelectorAll('.op,.ficha').forEach(b => b.disabled = true);
  document.querySelector('.prog i').style.width = (100 * LEC.bien / LEC.total) + '%';
  const pie = document.getElementById('pie'); const bien = ok || q.t === 'emparejar';
  pie.className = 'pie-lec ' + (bien ? 'bien' : 'mal');
  const frases = ['¡Bien hecho!', '¡Correcto!', '¡Muy bien!', '¡Exacto!', '¡Eso es!'];
  pie.querySelector('.dentro').innerHTML = `
    <h3>${bien ? (emparejadoConFallos ? '¡Completado!' : frases[Math.floor(Math.random() * frases.length)]) : 'Respuesta correcta:'}</h3>
    ${!bien ? `<p><b>${esc(correcta)}</b></p>` : ''}
    ${q.exp ? `<p>${esc(q.exp)}</p>` : ''}
    <p class="ref">📖 ${esc(q.ref)}</p>
    <button class="btn grande" id="b-seguir">Continuar</button>`;
  document.getElementById('b-seguir').onclick = () => LEC.cola.length ? pintarPregunta() : terminar();
  document.getElementById('b-seguir').focus();
}
function terminar() {
  const perfecta = LEC.errores === 0;
  const bonus = LEC.modo === 'leccion' ? (perfecta ? 20 : 10) : 5;
  const total = LEC.xp + bonus;
  const rachaAntes = rachaViva();
  sumarXP(total);
  let estrellas = 0;
  if (LEC.modo === 'leccion') {
    estrellas = perfecta ? 3 : LEC.errores <= 2 ? 2 : 1;
    const k = claveLec(LEC.L.id, LEC.ui, LEC.li), prev = E.lecciones[k];
    E.lecciones[k] = { estrellas: Math.max(estrellas, prev ? prev.estrellas : 0), fecha: hoyISO() };
    guardarE();
  }
  const precision = Math.round(100 * LEC.total / (LEC.total + LEC.errores));
  confeti(perfecta ? 140 : 80); sonido('fin');
  const subioRacha = rachaViva() > rachaAntes;
  APP.innerHTML = `<div class="fin">
    <div class="big">${perfecta ? '🏆' : '🎉'}</div>
    <h1 class="t">${LEC.modo === 'repaso' ? '¡Repaso completado!' : perfecta ? '¡Lección perfecta!' : '¡Lección completada!'}</h1>
    ${estrellas ? `<div style="font-size:2rem;color:var(--ambar);letter-spacing:4px">${'★'.repeat(estrellas)}${'☆'.repeat(3 - estrellas)}</div>` : ''}
    <div class="cajas"><div class="caja-f"><b>+${total}</b>puntos</div><div class="caja-f"><b>${precision}%</b>aciertos</div><div class="caja-f"><b>🔥 ${rachaViva()}</b>${rachaViva() === 1 ? 'día' : 'días'}</div></div>
    ${subioRacha ? `<p style="margin:0;font-weight:800;color:#FF9A4D">${rachaViva() === 1 ? '¡Empiezas tu racha! Vuelve mañana para seguir.' : '¡Tu racha sigue viva!'}</p>` : ''}
    ${LEC.errores ? `<p class="pie" style="opacity:1;margin:0">Las preguntas que fallaste quedan guardadas para repasarlas.</p>` : ''}
    <button class="btn grande" id="b-fin">Continuar</button></div>`;
  document.getElementById('b-fin').onclick = () => LEC.modo === 'repaso' && !LEC.vuelta ? inicio() : verLibro(LEC.L ? LEC.L.id : LEC.vuelta);
}
function salir() {
  if (!LEC || (LEC.bien === 0 && LEC.errores === 0)) return volver();
  const v = document.createElement('div');
  v.className = 'pie-lec'; v.style.zIndex = 30;
  v.innerHTML = `<div class="dentro"><h3>¿Seguro que quieres salir?</h3><p>Si sales ahora, perderás el progreso de esta lección.</p>
    <button class="btn grande" id="b-quedar">Seguir aprendiendo</button><button class="btn sec grande" id="b-irse">Salir</button></div>`;
  document.body.appendChild(v);
  v.querySelector('#b-quedar').onclick = () => v.remove();
  v.querySelector('#b-irse').onclick = () => { v.remove(); volver(); };
}
function volver() { const id = LEC && (LEC.L ? LEC.L.id : LEC.vuelta); LEC = null; id ? verLibro(id) : inicio(); }

// ===================== Arranque =====================
const lib = new URLSearchParams(location.search).get('libro');
lib ? verLibro(lib).catch(inicio) : inicio();
</script>
