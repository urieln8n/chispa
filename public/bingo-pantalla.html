<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulsazo · Bingo musical</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{overflow-x:hidden}
  main{position:relative;z-index:2;min-height:calc(100vh - 76px);display:flex;flex-direction:column;padding:0 2rem 1.4rem;gap:1.2rem}
  .config{max-width:760px;margin:0 auto;width:100%;display:grid;gap:1rem}
  .grupo{display:grid;gap:.5rem}
  .grupo>b{font-size:1.05rem}
  .opciones-b{display:flex;gap:.6rem;flex-wrap:wrap}
  .opt{display:flex;align-items:center;gap:.5rem;background:#0b1626;border:2px solid var(--noche3);border-radius:14px;padding:.6rem .9rem;cursor:pointer;font-weight:700}
  .opt:has(input:checked){border-color:var(--ambar)}
  .opt input{accent-color:var(--ambar)}
  .sala{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center}
  .pin-caja{background:#fff;color:#0F1B2D;border-radius:24px;padding:1.2rem 1.6rem;display:flex;gap:1.6rem;align-items:center}
  .pin-caja .qr{width:190px;height:190px}.pin-caja .qr img{width:100%;height:100%}
  .pin-num{font-family:var(--tit);font-weight:800;font-size:clamp(3rem,8vw,6.5rem);line-height:1;letter-spacing:.06em}
  .chip{background:var(--noche3);padding:.5em 1em;border-radius:99px;font-weight:800;font-size:1.1rem;animation:pop .35s both;cursor:pointer}
  .chip.off{opacity:.45}.chip:hover{background:var(--mal)}
  .jugs{display:flex;flex-wrap:wrap;gap:.6rem}
  .escena{display:grid;grid-template-columns:1fr 340px;gap:1.4rem;flex:1}
  .principal{background:rgba(15,27,45,.72);border:1px solid #2a4369;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;min-height:420px}
  .numero{font-family:var(--tit);font-weight:800;font-size:1.6rem;color:var(--suave)}
  .titulo-c{font-family:var(--tit);font-weight:800;font-size:clamp(2.2rem,5vw,4.6rem);line-height:1.05}
  .artista-c{font-size:clamp(1.2rem,2.4vw,2rem);font-weight:700;color:var(--ambar)}
  .anillo{font-weight:800;color:var(--suave)}
  .lateral{display:flex;flex-direction:column;gap:1rem}
  .caja-l{background:rgba(15,27,45,.72);border:1px solid #2a4369;border-radius:20px;padding:1rem 1.2rem}
  .ronda-g{font-family:var(--tit);font-weight:800;font-size:1.9rem;color:var(--ambar)}
  .cerca{font-family:var(--tit);font-weight:800;font-size:2.6rem}
  .hist{display:grid;gap:.35rem;max-height:34vh;overflow:auto}
  .hist div{display:flex;justify-content:space-between;gap:.6rem;font-weight:700;border-bottom:1px solid #22385a;padding:.25rem 0}
  .hist span{color:var(--suave);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .control{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
  .velo{position:fixed;inset:0;background:rgba(6,11,20,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:2rem}
  .gan{max-width:900px;width:100%;text-align:center;display:grid;gap:1rem;justify-items:center}
  .gan h1{font-size:clamp(3rem,8vw,6rem);color:var(--ambar)}
  .mini{display:grid;gap:6px;width:min(560px,90vw)}
  .mini div{background:#2a3b57;border-radius:10px;padding:.4rem;font-size:.75rem;font-weight:800;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9fb0c8}
  .mini .s{background:#F4F1EA;color:#0F1B2D}
  .mini .p{background:var(--ambar);color:#0F1B2D;outline:3px solid #fff}
  .final-l{display:grid;gap:.8rem;max-width:760px;margin:0 auto;width:100%}
  .final-l div{background:rgba(15,27,45,.8);border:1px solid #2a4369;border-radius:18px;padding:1rem 1.4rem;font-size:1.4rem;display:flex;justify-content:space-between;gap:1rem;animation:sube .5s both}
  @media(max-width:900px){.escena{grid-template-columns:1fr}.sala{grid-template-columns:1fr}.pin-caja{flex-direction:column}}
</style>
</head>
<body>
<div class="barra-sup" style="position:relative;z-index:2"><div id="m"></div><div style="display:flex;gap:.6rem;align-items:center"><button id="b-mando" class="btn sec peq oculto">📱 Mando en mi móvil</button><span id="info" class="pie"></span></div></div>
<main id="escena"><div class="centro" style="min-height:50vh"><h2>Preparando…</h2></div></main>
<script src="comun.js"></script>
<script>
$('#m').innerHTML = marca();
const qs = new URLSearchParams(location.search);
let socket = null, S = null, CLAVE = '', PIN = '', relojRev = null;
const ES = $('#escena');
const emitir = (t, d = {}) => new Promise(r => socket.emit(t, d, r));

// ---------- 1. Configurar la partida ----------
async function configurar(id) {
  const lista = await api('cuestionarios/' + id);
  if (lista.tipo !== 'bingo') { location.href = 'presentar?id=' + id; return; }
  const esNavidad = /navidad|christmas|villancic/i.test(lista.titulo + ' ' + lista.categoria);
  const n = lista.canciones.length;
  const tam = [[3, 'Rápido 3×3', 13], [4, 'Normal 4×4', 20], [5, 'Clásico 5×5 (centro libre)', 28]];
  ES.innerHTML = `<div class="config">
    <h1>🎵 ${esc(lista.titulo)}</h1><p class="pie" style="margin:0">${n} canciones en la lista. Recuerda: la música la pones tú con el equipo del local; aquí marcas qué canción suena.</p>
    <div class="tarjeta grupo"><b>Tamaño del cartón</b><div class="opciones-b">${tam.map(([v, t, min]) => `<label class="opt"><input type="radio" name="tam" value="${v}" ${v === 4 && n >= 20 ? 'checked' : v === 3 && n < 20 ? 'checked' : ''} ${n < min ? 'disabled' : ''}> ${t}</label>`).join('')}</div></div>
    <div class="tarjeta grupo"><b>Rondas</b><div class="opciones-b">
      <label class="opt"><input type="checkbox" name="ronda" value="linea" checked> Línea</label>
      <label class="opt"><input type="checkbox" name="ronda" value="doble"> Dos líneas</label>
      <label class="opt"><input type="checkbox" name="ronda" value="lleno" checked> Cartón lleno</label></div>
      <span class="pie">Línea = fila, columna o diagonal completa.</span></div>
    <div class="tarjeta grupo"><b>En el cartón se ve…</b><div class="opciones-b">
      <label class="opt"><input type="radio" name="mostrar" value="titulo" checked> El título (y el artista en pequeño)</label>
      <label class="opt"><input type="radio" name="mostrar" value="artista"> Solo el artista (más difícil)</label></div></div>
    <div class="tarjeta grupo"><b>Revelar el título en pantalla</b><div class="opciones-b">
      ${[[15, 'A los 15 s'], [25, 'A los 25 s'], [40, 'A los 40 s'], [0, 'Solo cuando yo pulse']].map(([v, t]) => `<label class="opt"><input type="radio" name="revelar" value="${v}" ${v === 25 ? 'checked' : ''}> ${t}</label>`).join('')}</div></div>
    <div class="tarjeta grupo"><b>Tema</b><div class="opciones-b">
      <label class="opt"><input type="radio" name="tema" value="chispa" ${esNavidad ? '' : 'checked'}> ⚡ Normal</label>
      <label class="opt"><input type="radio" name="tema" value="navidad" ${esNavidad ? 'checked' : ''}> 🎄 Navidad (con nieve)</label></div></div>
    <div class="control"><a class="btn sec" href="panel">Cancelar</a><button class="btn" id="b-crear">Crear partida ▶</button></div>
    <div id="e-crear" class="error"></div></div>`;
  document.querySelectorAll('input[name=tema]').forEach(i => i.onchange = () => aplicarTema(i.value));
  aplicarTema(esNavidad ? 'navidad' : 'chispa');
  $('#b-crear').onclick = async () => {
    const v = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value;
    const opciones = { tamano: +v('tam'), rondas: [...document.querySelectorAll('input[name=ronda]:checked')].map(i => i.value), mostrar: v('mostrar'), revelar: +v('revelar'), tema: v('tema') };
    let lugar = ''; try { lugar = localStorage.getItem('chispa-lugar') || ''; } catch {}
    try {
      const r = await api('partidas', { method: 'POST', body: { cuestionarioId: id, lugar, opciones } });
      history.replaceState(null, '', `bingo-pantalla?pin=${r.pin}`);
      arrancar(r.pin, r.claveHost);
    } catch (e) { $('#e-crear').textContent = e.message; }
  };
}

// ---------- 2. Conectar como presentador ----------
function arrancar(pin, clave) {
  PIN = pin; CLAVE = clave;
  try { sessionStorage.setItem('chispa-bingo-' + pin, clave); } catch {}
  $('#info').textContent = 'PIN ' + pin; $('#b-mando').classList.remove('oculto');
  socket = conectarJuego(pin);
  socket.on('connect', async () => {
    const r = await emitir('host:reanudar', { claveHost: CLAVE });
    if (r.error) { ES.innerHTML = `<div class="centro"><h2>${esc(r.error)}</h2><a class="btn" href="panel">Volver</a></div>`; return; }
    S = r.estado; aplicarTema(S.tema); pintar();
  });
  socket.on('disconnect', () => aviso('Conexión perdida… reconectando'));
  socket.on('host:jugadores', l => { if (S) { S.jugadores = l; if (S.estado === 'sala') pintarJugadores(); } });
  socket.on('bingo:estado', e => { const antes = S && S.estado; S = e; if (antes !== e.estado || e.estado !== 'juego') pintar(); else pintarJuego(); });
  socket.on('bingo:cancion', d => { sonido('tic'); arrancarReloj(d.revelarSeg); });
  socket.on('bingo:revelada', () => { clearInterval(relojRev); sonido('ok'); });
  socket.on('bingo:ganador', ganador);
  socket.on('bingo:falso', d => { sonido('mal'); aviso(`❌ ¡Bingo falso de ${d.apodo}! 10 segundos sin cantar`, 4000); });
  socket.on('bingo:ronda', d => aviso(`Nueva ronda: ${d.nombreRonda}`, 3500));
}

function pintar() {
  if (!S) return;
  if (S.estado === 'sala') return sala();
  if (S.estado === 'final') return final();
  if (!$('#principal')) montarJuego();
  pintarJuego();
}
function urlJugar() { return new URL(BASE + 'bingo-jugar?pin=' + PIN, location.href).href; }
function sala() {
  const url = urlJugar();
  ES.innerHTML = `<div class="sala">
      <div class="pin-caja"><div class="qr"><img alt="Código QR para entrar" src="${BASE}api/qr?t=${encodeURIComponent(url)}"></div>
        <div><div style="font-weight:800">Entra desde el móvil en</div><div style="font-weight:700;opacity:.75;word-break:break-all">${esc(new URL(BASE, location.href).host + BASE + 'jugar')}</div>
        <div style="font-weight:800;margin-top:.6rem">con el PIN</div><div class="pin-num">${PIN.slice(0, 3)} ${PIN.slice(3)}</div></div></div>
      <div><h1>🎵 Bingo musical</h1><h2 style="color:var(--ambar);margin-top:.3rem">${esc(S.titulo)}</h2>
        <p class="pie" style="font-size:1rem;opacity:.85">Escanea el QR, escribe tu nombre y recibirás tu cartón. Rondas: ${S.rondas.map(esc).join(' → ')}.</p></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><div style="font-family:var(--tit);font-size:2.2rem;font-weight:800"><span id="njug">0</span> jugadores</div>
      <div class="control"><button class="btn" id="b-empezar">¡Empezar! Primera canción ▶</button></div></div>
    <div class="jugs" id="jugs"></div>`;
  $('#b-empezar').onclick = () => emitir('bingo:siguiente');
  pintarJugadores();
}
function pintarJugadores() {
  const box = $('#jugs'); if (!box) return;
  $('#njug').textContent = S.jugadores.length;
  box.innerHTML = S.jugadores.map(j => `<span class="chip ${j.conectado ? '' : 'off'}" title="Pulsa para sacarlo" data-id="${j.id}">${esc(j.apodo)}</span>`).join('');
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => emitir('host:expulsar', { id: c.dataset.id }));
}
function montarJuego() {
  ES.innerHTML = `<div class="escena">
      <div class="principal" id="principal"></div>
      <div class="lateral">
        <div class="caja-l"><div class="pie" style="opacity:1;font-weight:800">RONDA <span id="r-num"></span></div><div class="ronda-g" id="r-nom"></div></div>
        <div class="caja-l"><div class="cerca" id="cerca">0</div><div class="pie" style="opacity:1;font-weight:700" id="cerca-txt">jugadores a una canción de cantar</div></div>
        <div class="caja-l" style="flex:1"><b>Ya han sonado</b><div class="hist" id="hist" style="margin-top:.5rem"></div></div>
      </div></div>
    <div class="control">
      <span class="pie" style="align-self:center" id="jug-info"></span>
      <button class="btn sec" id="b-cual" title="Muestra 3 segundos qué canción toca poner (mejor usa el mando en tu móvil)">🎧 ¿Cuál pongo?</button>
      <button class="btn sec" id="b-deshacer" title="Quitar la última canción si te equivocaste">↩ Deshacer</button>
      <button class="btn sec" id="b-revelar">👁 Revelar</button>
      <button class="btn sec" id="b-ronda">Siguiente ronda ➡</button>
      <button class="btn" id="b-sig">⏭ Siguiente canción</button>
    </div>`;
  $('#b-sig').onclick = async () => { const r = await emitir('bingo:siguiente'); if (r.error) aviso(r.error); };
  $('#b-revelar').onclick = () => emitir('bingo:revelar');
  $('#b-cual').onclick = () => { const s = S.siguiente; aviso(s ? `Pon: ${s.titulo} — ${s.artista}` : 'No quedan canciones', 3000); };
  $('#b-deshacer').onclick = () => emitir('bingo:deshacer');
  $('#b-ronda').onclick = () => emitir('bingo:siguienteRonda');
}
function pintarJuego() {
  if (!$('#principal')) montarJuego();
  const a = S.actual;
  $('#principal').innerHTML = `<div class="numero">Canción ${S.numero}</div>
    <div class="ecualizador" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    ${S.revelada && a ? `<div class="titulo-c pop">${esc(a.titulo)}</div><div class="artista-c">${esc(a.artista)}</div>`
      : `<div class="titulo-c" style="opacity:.9">¿La tienes en tu cartón?</div><div class="anillo" id="anillo">${S.revelarSeg ? '' : 'El presentador la revelará'}</div>`}`;
  $('#r-num').textContent = `${S.ronda + 1} de ${S.rondas.length}`;
  $('#r-nom').textContent = S.nombreRonda;
  $('#cerca').textContent = S.cerca;
  $('#cerca-txt').textContent = S.cerca === 1 ? 'jugador a una canción de cantar' : 'jugadores a una canción de cantar';
  $('#hist').innerHTML = S.historial.length ? S.historial.map(c => `<div>${esc(c.titulo)}<span>${esc(c.artista)}</span></div>`).join('') : '<span class="pie">Todavía ninguna</span>';
  $('#jug-info').textContent = `${S.jugadores.length} jugadores · ${S.canciones.filter(c => !c.sonada).length} canciones por sonar`;
  $('#b-ronda').textContent = S.ronda + 1 >= S.rondas.length ? 'Terminar y ver ganadores 🏆' : 'Siguiente ronda ➡';
  $('#b-revelar').disabled = S.revelada || !S.numero;
}
function arrancarReloj(seg) {
  clearInterval(relojRev); if (!seg) return;
  let s = seg; const t = () => { const el = $('#anillo'); if (el) el.textContent = `Se revela en ${s} s`; s--; if (s < 0) clearInterval(relojRev); };
  setTimeout(t, 50); relojRev = setInterval(t, 1000);
}
function ganador(d) {
  sonido('fin'); confeti(160);
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="gan pop">
    <div class="pie" style="font-size:1.3rem;opacity:1;font-weight:800">${d.primero ? '¡Tenemos ganador!' : 'También canta'}</div>
    <h1>¡${esc(d.nombreRonda.toUpperCase())}!</h1>
    <div style="font-family:var(--tit);font-size:clamp(2rem,5vw,3.6rem);font-weight:800">${esc(d.apodo)}</div>
    <div class="mini" style="grid-template-columns:repeat(${d.n},1fr)">${d.carton.map(c => `<div class="${c.patron ? 'p' : c.sonada ? 's' : ''}">${esc(c.titulo)}</div>`).join('')}</div>
    <p class="pie" style="font-size:1rem;opacity:.9">✔ Comprobado automáticamente: todas las canciones marcadas han sonado.</p>
    <div class="control" style="justify-content:center"><button class="btn sec" data-a="seguir">Seguir en esta ronda</button><button class="btn" data-a="ronda">${d.ultima ? 'Ver ganadores 🏆' : 'Siguiente ronda ➡'}</button></div></div>`;
  v.querySelector('[data-a=seguir]').onclick = () => v.remove();
  v.querySelector('[data-a=ronda]').onclick = () => { v.remove(); emitir('bingo:siguienteRonda'); };
  document.querySelectorAll('.velo').forEach(x => x.remove());
  document.body.appendChild(v);
}
function final() {
  document.querySelectorAll('.velo').forEach(x => x.remove());
  ES.innerHTML = `<h1 style="text-align:center">🏆 Ganadores</h1>
    <div class="final-l">${S.ganadores.map((r, i) => `<div style="animation-delay:${i * .15}s"><b>${esc(r.ronda)}</b><span>${r.jugadores.length ? r.jugadores.map(esc).join(', ') : '—'}</span></div>`).join('')}</div>
    <div class="control" style="margin-top:auto"><a class="btn sec" href="panel">Volver a mi biblioteca</a></div>`;
  confeti(180);
}

// ---------- Mando a distancia en el móvil del presentador ----------
$('#b-mando').onclick = () => {
  const url = new URL(BASE + `bingo-mando?pin=${PIN}#${encodeURIComponent(CLAVE)}`, location.href).href;
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="tarjeta pop" style="text-align:center;max-width:420px;display:grid;gap:1rem;justify-items:center">
    <h2>📱 Mando del presentador</h2><p style="margin:0">Escanéalo con <b>tu</b> móvil para ver qué canción poner y controlar la partida sin que el público lo vea.</p>
    <div style="background:#fff;border-radius:16px;padding:12px;width:240px;height:240px"><img alt="QR del mando" style="width:100%;height:100%" src="${BASE}api/qr?t=${encodeURIComponent(url)}"></div>
    <p class="pie" style="margin:0">No lo enseñes al público: quien lo escanee puede controlar la partida.</p>
    <button class="btn">Cerrar</button></div>`;
  v.querySelector('button').onclick = () => v.remove(); document.body.appendChild(v);
};

// ---------- Arranque ----------
(async () => {
  const pin = qs.get('pin'), id = qs.get('id');
  let clave = ''; try { clave = sessionStorage.getItem('chispa-bingo-' + pin) || ''; } catch {}
  if (pin && clave) return arrancar(pin, clave);
  if (id) return configurar(id).catch(e => { if (e.message !== 'login') ES.innerHTML = `<div class="centro"><h2>${esc(e.message)}</h2></div>`; });
  location.href = 'panel';
})();
</script>
</body>
</html>
