<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1B2D">
<title>Pulsazo · Entra a jugar</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pantalla{min-height:100vh;display:flex;flex-direction:column}
  .titulo-pin{font-size:1.25rem;margin:.4rem 0 .2rem;text-align:center;color:var(--suave)}
  .cab{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;font-weight:800}
  .cab .pts{background:var(--noche3);padding:.3em .8em;border-radius:99px}
  #pin{font-size:2rem;text-align:center;letter-spacing:.3em;font-weight:800}
  #apodo{font-size:1.4rem;text-align:center;font-weight:700}
  .entrar{max-width:360px;width:100%;display:flex;flex-direction:column;gap:.8rem}
  .resp{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
  .resp .opcion{flex-direction:column;justify-content:center;font-size:1rem;text-align:center}
  .resp .opcion .forma{width:3.2rem;height:3.2rem}
  .resp .opcion small{font-weight:700;opacity:.95;max-height:4.5em;overflow:hidden}
  .resp.una .opcion{grid-column:span 2}
  .grande{font-size:3.2rem}
  .res-ok{background:linear-gradient(160deg,#16a34a,#0f7a37)}
  .res-mal{background:linear-gradient(160deg,#dc2626,#8f1717)}
  .res-nada{background:linear-gradient(160deg,#475569,#273448)}
  .burbuja{background:rgba(0,0,0,.25);border-radius:99px;padding:.5em 1.2em;font-weight:800}
  .cuenta{font-size:5rem;font-family:var(--tit);font-weight:800}
  .preg-txt{padding:0 1rem;font-weight:700;font-size:1.05rem}
  .tbar{height:8px;background:var(--noche3);margin:0 10px;border-radius:99px;overflow:hidden}
  .tbar i{display:block;height:100%;background:var(--ambar);width:100%;transition:width linear}
</style>
</head>
<body>
<!-- 1. PIN -->
<section id="v-pin" class="centro">
  <div id="marca1"></div>
  <h1 class="titulo-pin">Escribe el PIN de la partida</h1>
  <div class="tarjeta entrar">
    <input id="pin" class="campo" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button id="b-pin" class="btn">Entrar</button>
    <div id="e-pin" class="error"></div>
  </div>
  <p class="pie">¿Vas a presentar? <a href="panel">Crea tu partida</a></p>
  <p id="creditos" class="pie" style="font-size:.75rem;max-width:520px;text-align:center;margin:1rem auto 0"></p>
</section>

<!-- 2. Apodo -->
<section id="v-apodo" class="centro oculto">
  <div id="marca2"></div>
  <p id="titulo-partida" class="pie"></p>
  <div class="tarjeta entrar">
    <input id="apodo" class="campo" maxlength="20" placeholder="Tu apodo" autocomplete="off">
    <button id="b-apodo" class="btn">¡Listo, a jugar!</button>
    <div id="e-apodo" class="error"></div>
  </div>
</section>

<!-- 3. Juego -->
<section id="v-juego" class="pantalla oculto">
  <div class="cab"><span id="yo"></span><span class="pts" id="mis-pts">0</span></div>
  <div id="area" class="centro" style="min-height:auto;flex:1"></div>
</section>

<script src="comun.js"></script>
<script>
$('#marca1').innerHTML = marca(); $('#marca2').innerHTML = marca();
let socket = null;
let PIN = '', yo = null, tick = null;
const qs = new URLSearchParams(location.search);

function ver(id) { ['v-pin', 'v-apodo', 'v-juego'].forEach(v => $('#' + v).classList.toggle('oculto', v !== id)); }
function guardar() { try { localStorage.setItem('chispa-j-' + PIN, JSON.stringify(yo)); } catch {} }
function leer(pin) { try { return JSON.parse(localStorage.getItem('chispa-j-' + pin) || 'null'); } catch { return null; } }
function olvidar() { try { localStorage.removeItem('chispa-j-' + PIN); } catch {} }
function area(html, cls = '') { const a = $('#area'); a.className = 'centro ' + cls; a.style.cssText = 'min-height:auto;flex:1'; a.innerHTML = html; }

async function comprobarPin(pin) {
  if (socket) { socket.close(); socket = null; }
  PIN = String(pin).replace(/\D/g, '');
  $('#e-pin').textContent = '';
  if (PIN.length !== 6) { ver('v-pin'); $('#e-pin').textContent = 'El PIN tiene 6 números'; return; }
  const r = await fetch(BASE + 'api/partidas/' + PIN).then(x => x.json()).catch(() => ({ error: 'Sin conexión, prueba otra vez' }));
  if (r.error) { ver('v-pin'); $('#e-pin').textContent = r.error; return; }
  if (r.tipo === 'bingo') { location.href = 'bingo-jugar?pin=' + PIN; return; }
  $('#titulo-partida').textContent = r.titulo;
  yo = leer(PIN);
  socket = conectarJuego(PIN);
  escuchar();
  if (!yo) { ver('v-apodo'); $('#apodo').focus(); }
}
function entrar(apodo, token) {
  socket.emit('jugador:entrar', { apodo, token }, r => {
    if (r.error) {
      if (token) { olvidar(); yo = null; ver('v-apodo'); return; }
      $('#e-apodo').textContent = r.error; return;
    }
    yo = { id: r.id, token: r.token, apodo: r.apodo }; guardar();
    $('#yo').textContent = r.apodo; $('#mis-pts').textContent = r.puntos;
    ver('v-juego');
    if (r.pregunta) mostrarPregunta(r.pregunta);
    else if (r.resultado) mostrarResultado(r.resultado);
    else if (r.final) mostrarFinal(r.final);
    else esperar();
  });
}
function esperar() {
  const enlace = new URL(BASE + 'jugar?pin=' + PIN, location.href).href;
  area(`<div class="pop" style="display:grid;gap:.8rem;justify-items:center;max-width:420px"><div class="grande">🎉</div><h2>¡Estás dentro!</h2><p style="margin:0">¿Ves tu apodo en la pantalla? En cuanto empiece, aquí salen las respuestas.</p>
    <p class="pie" style="opacity:1;font-weight:800;margin:.6rem 0 0">¿Quieres que juegue alguien más?</p>
    ${barraCompartir(`🎮 ¡Únete a la partida de ${MARCA.nombre}! PIN ${PIN}:`, enlace, 'Invitar')}</div>`);
}
function mostrarPregunta(p) {
  clearInterval(tick);
  const arrancar = () => {
    if (p.yaRespondio) return enviado();
    const una = p.opciones.length === 2 ? '' : '';
    $('#area').className = ''; $('#area').style.cssText = 'flex:1;display:flex;flex-direction:column';
    $('#area').innerHTML = `<div class="preg-txt">${p.indice + 1}/${p.total} · ${esc(p.texto)}</div>
      <div class="tbar" style="margin-top:.6rem"><i id="tb"></i></div>
      <div class="resp ${una}">${p.opciones.map((o, i) => o ? `<button class="opcion op-${i}" data-i="${i}" aria-label="${NOMBRES_FORMA[i]}">${FORMAS[i]}<small>${esc(o)}</small></button>` : '').join('')}</div>`;
    const total = (p.restante ?? p.tiempo * 1000);
    const tb = $('#tb'); tb.style.width = (100 * total / (p.tiempo * 1000)) + '%';
    requestAnimationFrame(() => { tb.style.transitionDuration = total + 'ms'; tb.style.width = '0%'; });
    document.querySelectorAll('.resp .opcion').forEach(b => b.onclick = () => {
      if (navigator.vibrate) navigator.vibrate(30);
      document.querySelectorAll('.resp .opcion').forEach(x => x.disabled = true);
      socket.emit('jugador:responder', { opcion: +b.dataset.i }, r => { if (r.error) aviso(r.error); enviado(); });
    });
  };
  if (p.empiezaEn > 300) {
    let n = Math.ceil(p.empiezaEn / 1000);
    area(`<p class="burbuja">Pregunta ${p.indice + 1} de ${p.total}</p><div class="cuenta pop" id="cd">${n}</div><p>¡Prepárate!</p>`);
    tick = setInterval(() => { n--; if (n <= 0) { clearInterval(tick); arrancar(); } else $('#cd').textContent = n; }, 1000);
  } else arrancar();
}
function enviado() {
  area(`<div class="pop"><div class="grande">⏳</div><h2>¡Respuesta enviada!</h2><p>¿Habrás sido el más rápido?</p></div>`);
}
function mostrarResultado(r) {
  $('#mis-pts').textContent = r.puntos;
  const cls = !r.respondio ? 'res-nada' : r.acierto ? 'res-ok' : 'res-mal';
  const tit = !r.respondio ? 'Se acabó el tiempo' : r.acierto ? (MARCA.id === 'fe' ? '¡Correcto!' : '¡Chispazo!') : '¡Casi!';
  const ico = !r.respondio ? '⌛' : r.acierto ? '✔' : '✖';
  const racha = r.racha >= 2 ? `<p class="burbuja">🔥 Racha de ${r.racha}</p>` : '';
  const delante = r.puesto === 1 ? '<p>¡Vas primero! 👑</p>' : r.delante ? `<p>A ${r.delante.diferencia} puntos de <b>${esc(r.delante.apodo)}</b></p>` : '';
  area(`<div class="pop" style="display:flex;flex-direction:column;align-items:center;gap:.6rem"><div class="grande">${ico}</div><h2>${tit}</h2>
    ${r.acierto ? `<p class="burbuja">+${r.ganados}</p>` : ''}${racha}<p>Vas <b>${r.puesto}.º</b></p>${delante}
    ${r.reflexion ? `<div class="reflexion" style="max-width:360px;margin-top:.4rem">${r.reflexion.cita ? `<div class="cita">${citaRV(r.reflexion.cita)}</div>` : ''}<p style="font-size:1rem">${esc(r.reflexion.texto)}</p></div>` : ''}</div>`, cls);
  document.body.style.background = ''; if (navigator.vibrate) navigator.vibrate(r.acierto ? [40, 40, 40] : 200);
}
function mostrarFinal(f) {
  $('#mis-pts').textContent = f.puntos;
  const med = ['🥇', '🥈', '🥉'][f.puesto - 1] || '⭐';
  area(`<div class="pop" style="display:flex;flex-direction:column;align-items:center;gap:.7rem;max-width:420px"><div class="grande">${med}</div><h2>Has quedado ${f.puesto}.º de ${f.total}</h2><p class="burbuja" style="display:inline-block">${f.puntos} puntos</p>
    ${barraCompartir(`${med} He quedado ${f.puesto}.º de ${f.total} con ${f.puntos} puntos en «${$('#titulo-partida').textContent}» (${MARCA.nombre}). ¿Te atreves?`, new URL(BASE, location.href).href, 'Compartir mi resultado')}
    ${f.cierre ? `<div class="reflexion"><div class="cita">${esc(f.cierre.titulo || 'Para terminar')}</div><p style="font-size:1rem">${esc(f.cierre.texto)}</p>${f.cierre.cita ? `<p style="color:var(--ambar);font-weight:800;font-size:.95rem">${esc(f.cierre.cita)}</p>` : ''}</div>
      ${f.cierre.contacto ? `<div style="display:grid;gap:.5rem;width:100%"><button class="btn" id="b-saber">Quiero saber más</button><button class="btn sec" id="b-orar">Pedir oración</button></div><div id="form-contacto" style="width:100%"></div>` : ''}` : '<p>¡Gracias por jugar!</p>'}</div>`);
  if (f.cierre && f.cierre.contacto) { $('#b-saber').onclick = () => formulario('saber-mas'); $('#b-orar').onclick = () => formulario('oracion'); }
}
function formulario(tipo) {
  const saber = tipo === 'saber-mas';
  $('#form-contacto').innerHTML = `<div class="tarjeta" style="display:grid;gap:.6rem;text-align:left">
    <b>${saber ? 'Te contactamos para hablar con calma' : '¿Por qué podemos orar por ti?'}</b>
    <input class="campo" id="c-nombre" maxlength="80" placeholder="Tu nombre${saber ? '' : ' (opcional)'}" value="${esc(yo ? yo.apodo : '')}">
    <input class="campo" id="c-contacto" maxlength="120" placeholder="Teléfono o email${saber ? '' : ' (opcional, si quieres que te escriban)'}">
    <textarea class="campo" id="c-mensaje" maxlength="1000" rows="3" placeholder="${saber ? 'Algo que quieras contarnos (opcional)' : 'Tu petición'}"></textarea>
    <label style="display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;color:var(--suave)"><input type="checkbox" id="c-ok" style="margin-top:.2rem"> Acepto que la persona que organiza esta actividad guarde estos datos solo para contactarme o para orar por mí. Puedo pedir que los borre en cualquier momento.</label>
    <button class="btn" id="c-enviar">Enviar</button><div id="c-msg" class="error"></div></div>`;
  $('#c-enviar').onclick = async () => {
    if (!$('#c-ok').checked) { $('#c-msg').textContent = 'Marca la casilla para darnos permiso'; return; }
    const r = await fetch(BASE + 'api/contactos', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      pin: PIN, tipo, nombre: $('#c-nombre').value, contacto: $('#c-contacto').value, mensaje: $('#c-mensaje').value, consentimiento: true, actividad: $('#titulo-partida').textContent }) }).then(x => x.json()).catch(() => ({ error: 'Sin conexión' }));
    if (r.error) { $('#c-msg').textContent = r.error; return; }
    $('#form-contacto').innerHTML = `<div class="reflexion"><p>${saber ? '¡Gracias! Te contactaremos pronto.' : '¡Gracias! Vamos a orar por ti.'}</p></div>`;
  };
}

function escuchar() {
socket.on('jugador:pregunta', mostrarPregunta);
socket.on('jugador:resultado', mostrarResultado);
socket.on('jugador:final', mostrarFinal);
socket.on('jugador:expulsado', () => { olvidar(); yo = null; socket.close(); ver('v-juego'); area('<h2>El presentador te ha sacado de la partida</h2>'); });
socket.on('jugador:cerrada', () => { socket.close(); area('<h2>La partida ha terminado</h2><p><a href="jugar">Volver</a></p>'); });
// Reconexión automática: al volver la conexión, recupera tu sitio y tus puntos
socket.on('connect', () => { if (yo) entrar(null, yo.token); });
socket.on('disconnect', () => aviso('Conexión perdida… reconectando'));
}

$('#b-pin').onclick = () => comprobarPin($('#pin').value);
$('#pin').onkeydown = e => { if (e.key === 'Enter') comprobarPin($('#pin').value); };
$('#b-apodo').onclick = () => entrar($('#apodo').value);
$('#apodo').onkeydown = e => { if (e.key === 'Enter') entrar($('#apodo').value); };
if (qs.get('pin')) { $('#pin').value = qs.get('pin'); comprobarPin(qs.get('pin')); }
// Si la cita es bíblica (por ejemplo «Juan 3:16»), enlaza al pasaje en la Reina-Valera 1960
function citaRV(c) {
  if (!/^([1-3]\s)?[A-ZÁÉÍÓÚ][a-záéíóúñ]+\s\d+/.test(c || '')) return esc(c);
  return `<a href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(String(c).replace(/[–—]/g, '-'))}&version=RVR1960" target="_blank" rel="noopener" style="color:inherit">${esc(c)} · Leer en la RV1960 ↗</a>`;
}
</script>
</body>
</html>
